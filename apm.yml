name: agent-context
version: 0.5.0
description: Codex-first APM packages for leverage-works.
author: leverage-works
license: MIT
targets:
  - codex
devDependencies:
  apm:
    - path: ./packages/org-meta-bundle
scripts:
  hydrate-cached-docs: uv run .agents/skills/use-cached-docs/scripts/hydrate_cached_docs.py

marketplace:
  owner:
    name: leverage-works
    url: https://github.com/leverage-works
  outputs:
    claude: {}
    codex: {}
  versioning:
    strategy: lockstep
  packages:
    - name: org-meta-bundle
      source: leverage-works/agent-context
      subdir: packages/org-meta-bundle
      version: 0.5.0
      category: Productivity
