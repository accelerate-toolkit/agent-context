name: agent-context
version: 0.6.0
description: Codex-first APM packages for accelerate-toolkit.
author: accelerate-toolkit
license: MIT
targets:
  - codex
devDependencies:
  apm:
    - path: ./packages/org-meta-bundle
    - path: ./packages/frontend-react
scripts:
  hydrate-cached-docs: uv run .agents/skills/use-cached-docs/scripts/hydrate_cached_docs.py

marketplace:
  owner:
    name: accelerate-toolkit
    url: https://github.com/accelerate-toolkit
  outputs:
    claude: {}
    codex: {}
  versioning:
    strategy: lockstep
  packages:
    - name: org-meta-bundle
      source: accelerate-toolkit/agent-context
      subdir: packages/org-meta-bundle
      version: 0.6.0
      category: Productivity
    - name: frontend-react
      source: accelerate-toolkit/agent-context
      subdir: packages/frontend-react
      version: 0.6.0
      category: Development
