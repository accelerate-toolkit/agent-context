name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Plan release or recover interrupted publication
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --script scripts/release/release.py plan --repo "$GITHUB_REPOSITORY"
      - name: Prepare release metadata
        if: steps.plan.outputs.prepare == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: uv run --script scripts/release/release.py prepare --version "$VERSION"
      - name: Check out pending release
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.prepare != 'true'
        env:
          RELEASE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: git checkout --detach "$RELEASE_COMMIT"
      - name: Validate release
        if: steps.plan.outputs.release == 'true'
        run: |
          make test
          make release-check
          uv tool install apm-cli==0.30.0
          apm install --target codex --dry-run
          make apm-install
      - name: Commit and push synchronized metadata
        if: steps.plan.outputs.prepare == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apm.yml 'packages/*/apm.yml' .claude-plugin/marketplace.json apm.lock.yaml
          git commit -m "chore(release): v$VERSION" -m 'Synchronize package and marketplace metadata for the release.'
          git push origin HEAD:main
      - name: Publish immutable source release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: uv run --script scripts/release/release.py publish --version "$VERSION" --commit "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY"
